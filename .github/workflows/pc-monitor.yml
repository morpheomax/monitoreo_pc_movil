name: PC Monitor checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    name: Agent and delivery (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install agent dependencies
        run: python -m pip install -r agent/requirements.txt
      - name: Test sessions, protocol and process protection
        env:
          PYTHONPATH: agent
        run: python -m unittest discover -s agent/tests -v
      - name: Test USB startup
        run: python -m unittest discover -s tests -v
      - name: Verify APK checksums and packaged sources
        run: python tools/package_release.py --check
